

name: Build My Daily Progress APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          unzip -o MyDailyProgress-Android-Project.zip -d .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p MyDailyProgress assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyDailyProgress-debug-apk
          path: MyDailyProgress/app/build/outputs/apk/debug/app-debug.apk
